services:
  - type: web
    name: opportunityx-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: opportunityx-postgres
          property: connectionString
      - key: CLIENT_URL
        value: https://opportunityx.vercel.app

databases:
  - name: opportunityx-postgres
    databaseName: opportunityx
    user: opportunityx_user
    plan: free
